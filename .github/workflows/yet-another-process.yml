name: Process Things

on:
  workflow_dispatch:
    inputs:
      post_body:
        description: 'JSON body sent to /api/process. The "url" field is downloaded first and replaced with the local file path'
        required: false
        default: '{"hello":"world"}'
        type: string
      repo_ref:
        description: Branch, tag or commit of the app repo to test (defaults to vars.APP_REPO_REF or main)
        required: false
        default: ''
        type: string

  # Optional: run on pushes
  # push:
  #   branches: [main]

jobs:
  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # All run steps execute inside the cloned repo (the clone step overrides this)
    defaults:
      run:
        working-directory: app

    env:
      COMPOSE_PROJECT_NAME: itest
      COMPOSE_FILE: docker-compose.yml

      TARGET_URL: http://backend:8000
      COMPLETION_TIMEOUT: "3000"

      POST_BODY: ${{ inputs.post_body || '{"hello":"world"}' }}

      APP_REPO_URL: https://github.com/mutonby/openshorts.git
      APP_REPO_REF: ${{ inputs.repo_ref || vars.APP_REPO_REF || 'main' }}

    steps:
      - name: Clone or pull app repository
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail

          if [ -d app/.git ]; then
            echo "Existing clone found, updating..."
            git -C app remote set-url origin "$APP_REPO_URL"
          else
            echo "Cloning ${APP_REPO_URL} @ ${APP_REPO_REF}..."
            git init app
            git -C app remote add origin "$APP_REPO_URL"
          fi

          git -C app fetch --depth 1 origin "$APP_REPO_REF"
          git -C app checkout --force FETCH_HEAD

          echo "Checked out $(git -C app rev-parse --short HEAD)"
          test -f "app/${COMPOSE_FILE}" || { echo "${COMPOSE_FILE} not found in repo"; exit 1; }

      - name: Configure Docker
        run: |
          docker version
          docker compose version

      - name: Download input file
        shell: bash
        env:
          DOWNLOAD_AUTH_HEADER: ${{ secrets.DOWNLOAD_AUTH_HEADER }}
        run: |
          set -euo pipefail

          URL=$(echo "$POST_BODY" | jq -r '.url // empty')
          [ -n "$URL" ] || { echo "No 'url' in POST_BODY"; exit 1; }

          mkdir -p downloads

          case "$URL" in
            *youtube.com/*|*youtu.be/*)
              echo "YouTube URL, downloading with yt-dlp..."
              python3 -m pip install --quiet --user yt-dlp
              python3 -m yt_dlp -f "bv*+ba/b" --merge-output-format mp4 \
                -o "downloads/input.%(ext)s" "$URL"
              ;;
            *)
              echo "Downloading with curl..."
              NAME=$(basename "${URL%%\?*}")
              [ -n "$NAME" ] && [ "$NAME" != "/" ] || NAME="input.bin"

              # Optional auth: DOWNLOAD_AUTH_HEADER holds the full header line,
              # e.g. "Authorization: Bearer abc123" or "X-API-Key: abc123"
              AUTH_ARGS=()
              if [ -n "${DOWNLOAD_AUTH_HEADER:-}" ]; then
                AUTH_ARGS=(-H "$DOWNLOAD_AUTH_HEADER")
              fi

              curl -fSL --retry 3 --retry-delay 2 \
                "${AUTH_ARGS[@]}" \
                -o "downloads/$NAME" "$URL"
              ;;
          esac

          # Expose the downloaded file (relative to the repo dir) to later steps
          FILE=$(find downloads -type f | head -n 1)
          [ -n "$FILE" ] || { echo "Download produced no file"; exit 1; }

          echo "DOWNLOADED_FILE=$FILE" >> "$GITHUB_ENV"
          ls -lh downloads

      - name: Point POST_BODY at downloaded file
        shell: bash
        run: |
          set -euo pipefail

          # Drop .url and add .file with the local path; every other field is kept as-is
          NEW_BODY=$(echo "$POST_BODY" | jq -c --arg p "$DOWNLOADED_FILE" 'del(.url) | .file = $p')

          echo "POST_BODY_FINAL=$NEW_BODY" >> "$GITHUB_ENV"
          echo "Body to send: $NEW_BODY"

      - name: Prepare environment
        run: |
          printf '%s\n' "$ENV_FILE" > .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}

      - name: Prepare output directories
        run: |
          mkdir -p ./output/thumbnails
          touch ./output/.instance
          chmod -R 777 output

      - name: Start Docker Compose
        run: |
          docker compose up -d

      - name: Wait for backend and process job
        shell: bash
        run: |
          set -euo pipefail

          NET="${COMPOSE_PROJECT_NAME}_default"

          echo "Waiting for backend..."

          READY=0

          for i in $(seq 1 30); do
            if docker run --rm --network "$NET" curlimages/curl \
                 -s -o /dev/null --max-time 3 "$TARGET_URL/"; then
              echo "Backend is up after ${i} attempt(s)"
              READY=1
              break
            fi

            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "Backend did not become ready in time"
            docker compose ps
            docker compose logs --tail=100
            exit 1
          fi

          echo "Sending POST..."

          RESPONSE=$(docker run --rm --network "$NET" curlimages/curl \
            -sS --fail-with-body \
            -X POST "$TARGET_URL/api/process" \
            -H "Content-Type: application/json" \
            -d "$POST_BODY_FINAL")

          echo "$RESPONSE"

          ID=$(echo "$RESPONSE" | jq -r '.job_id // .id // empty')

          if [ -z "$ID" ]; then
            echo "No job id in response, cannot track completion"
            exit 1
          fi

          echo "Queued job $ID, waiting for it to finish..."

          DEADLINE=$(( $(date +%s) + COMPLETION_TIMEOUT ))

          while :; do

            STATUS=$(docker run --rm --network "$NET" curlimages/curl \
              -sS --max-time 5 "$TARGET_URL/api/status/$ID" \
              | jq -r '.status // empty' || true)

            echo "Status: ${STATUS:-unknown}"

            docker compose logs \
              --no-color \
              --no-log-prefix \
              --tail=15 backend || true

            case "$STATUS" in
              completed)
                echo "Job $ID finished successfully"
                break
                ;;

              failed|error|cancelled)
                echo "Job $ID failed"
                docker compose logs --tail=200
                exit 1
                ;;
            esac

            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "Timed out after ${COMPLETION_TIMEOUT}s waiting for job $ID"
              docker compose logs --tail=200
              exit 1
            fi

            sleep 5
          done

      - name: Keep generated clips only
        if: always()
        run: |
          find output -type f -name '*.mp4' ! -name '*clip*' -delete || true

      - name: Upload generated clips
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-output
          path: app/output/
          retention-days: 7
          if-no-files-found: warn

      - name: Collect Docker logs
        if: always()
        run: |
          docker compose logs --tail=200 || true

      - name: Cleanup Docker Compose
        if: always()
        run: |
          docker compose down -v --remove-orphans || true